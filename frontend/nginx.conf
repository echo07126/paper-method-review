server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 容器健康检查探针（不泄露业务信息，不进入 access_log）
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  # 安全响应头（CSP 适配 Vue SPA：样式需 inline，脚本仅同源）
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  # HSTS 仅在 HTTPS 终止后生效；纯 HTTP 演示环境请勿开启，避免把 localhost 锁死
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 60m;
    proxy_read_timeout 180s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
