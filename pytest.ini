[pytest]
# 让 pytest 以本项目为 rootdir。否则 rootdir 会落到仓库上层目录，缓存与临时目录也建到那里
# ——在受限/被策略加固的环境里那些目录可能不可写或不可删，表现为大量 PermissionError
# 与 PytestCacheWarning 噪声（详见 backend/tests/conftest.py 的临时根目录说明）。
testpaths = backend/tests
# 缓存写进仓库内的可写目录，避免落到上层目录里不可写的 `.pytest_cache`。
# 该目录整体已在 .gitignore 中忽略。
cache_dir = .pytest-basetemp/cache
