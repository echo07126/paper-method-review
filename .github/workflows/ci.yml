name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit
      - name: Dependency audit (fail on known vulns)
        run: pip-audit -r requirements.txt
      - name: Unit + contract tests
        run: python -m pytest backend/tests -q
      - name: Compile active scripts only
        run: python -m compileall -q backend/app backend/scripts/*.py
      # 指标回归：检出率 / 精确率 / 定位率的口径以本脚本实际输出为准
      - name: Eval regression (AC-2 / AC-3)
        run: python backend/scripts/eval_ac.py
      # 消融回归：E/A/B/C 四配置（要素提取 × 门控）与要素 P/R/F1；低于下限返回非零
      - name: Ablation regression (gate)
        run: python backend/scripts/ablation.py --strict
      # 安全核查：未通过时返回非零，阻断合并
      - name: Security audit (gate)
        run: python backend/scripts/security_audit.py
      # 接口冒烟：上传→审查→报告→导出→越权拦截→清理，含 data/ 隔离自证
      - name: API smoke (isolated)
        run: python backend/scripts/api_check.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          # 前端单测直接用 `node --test` 跑 TypeScript（Node 原生类型擦除），无需新增依赖；
          # 该能力在 Node 22.18+ 默认开启，这里固定到 24 与本地验证环境一致。
          node-version: "24"
      - run: npm ci --no-fund --no-audit
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
